<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web Apps</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2307080a'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='%23ff2b16' font-family='monospace'>&#9636;</text></svg>">
<style>
  :root { --bg:#07080a; --panel:#0e1013; --line:#23282f; --ink:#dfe3e8; --ink-dim:#8a929c; --accent:#ff2a14; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: max(24px, env(safe-area-inset-top)) 20px 40px;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 {
    margin: 12px 0 4px;
    font-size: clamp(24px, 7vw, 34px);
    letter-spacing: .16em;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(255, 45, 20, .45);
  }
  h1 span { color: var(--ink); text-shadow: none; }
  p.sub { margin: 0 0 28px; font-size: 12px; letter-spacing: .3em; color: var(--ink-dim); text-transform: uppercase; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.card {
    display: block;
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, background .15s;
  }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); background: #14171b; }
  a.card strong { display: block; font-size: 18px; letter-spacing: .1em; }
  a.card em { display: block; margin-top: 6px; font-style: normal; font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>WEB<span>APPS</span></h1>
  <p class="sub">chanhpomme</p>
  <ul>
    <li>
      <a class="card" href="basketball-scoreboard/">
        <strong>BASKETBALL SCOREBOARD</strong>
        <em>Retro red-LCD scoreboard for training — timer, team colors, target score.</em>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
